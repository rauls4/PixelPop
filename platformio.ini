; PixelPop firmware — PlatformIO project config
;
; Board: Waveshare ESP32-S3-RGB-Matrix (SKU 34422), 32 MB flash (QIO),
; 16 MB Octal (OPI) PSRAM, native USB CDC on boot.
;
; This mirrors the Arduino IDE FQBN this project used before the port:
;   esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=32M,PartitionScheme=app13M_data7M_32MB,PSRAM=opi
;
; Partition layout comes from partitions.csv next to this file (same file
; the Arduino IDE build used) — do not rely on board_build defaults for it.

[env:pixelpop]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / partitions ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.flash_size = 32MB

; --- PSRAM: Quad flash + Octal PSRAM (Arduino IDE's "OPI PSRAM" option) ---
board_build.arduino.memory_type = qio_opi

; --- USB CDC on boot (Arduino IDE: "USB CDC On Boot: Enabled") ---
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; --- Serial / upload ---
monitor_speed = 115200
upload_speed = 921600
; upload_port / monitor_port are left unset so PlatformIO auto-detects the
; /dev/cu.usbmodem* port; pass --upload-port explicitly if more than one
; PixelPop board is connected at once.

; --- Libraries (pinned to the versions installed for the Arduino IDE build,
; so the compiled output should match) ---
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
    bodmer/TJpg_Decoder@1.1.0
